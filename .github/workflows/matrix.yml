name: Build SMTCoq

on:
  pull_request_target:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    secrets:
      CELLER_ENDPOINT: ${{ secrets.CELLER_ENDPOINT }}
      CELLER_CACHE: ${{ secrets.CELLER_CACHE }}
      CELLER_TOKEN: ${{ secrets.CELLER_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SMTCoq
            repository: .
            override-input: self
          - name: Sniper
            repository: github:SMTCoq/Sniper
            override-input: SMTCoq

    uses: lafeychine/rocq-utils/.github/workflows/matrix-template.yml@main
    with:
      repository: ${{ matrix.repository }}
      override-input: ${{ matrix.override-input }}

  build-success:
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Has the matrix failed?
        if: ${{ needs.build.result != 'success' }}
        run: exit 1
